<!DOCTYPE html>
<html>
<head>
<title>Customer Login</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#f4f4f4;
}

form{
margin-top:100px;
}

input{
padding:10px;
margin:10px;
width:200px;
}

button{
padding:10px 30px;
background:#2e7d32;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.back{
background:#555;
}

</style>

</head>

<body>

<h2>Customer Login</h2>

<form method="POST">
{% csrf_token %}

<br>

<input type="text" name="username" placeholder="Username">

<br>

<input type="password" name="password" placeholder="Password">

<br><br>

<button type="submit">Login</button>

</form>
{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}
<br>

<a href="/">
<button class="back">Back</button>
</a>

</body>
</html>
