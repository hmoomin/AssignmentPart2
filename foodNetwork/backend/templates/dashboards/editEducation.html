{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Educational Content</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<input type="hidden" id="csrfToken" value="{{ csrf_token }}">

<h2 class="header">Edit Educational Content</h2>

<div class="card">
    <form id="form">
        <h3>Options:</h3><br>
        <select id="content_type">
        <option value="recipe">Recipe</option>
        <option value="storage">Storage Guidance</option>
        <option value="story">Farm Story</option>
        </select><br>
        <h3>Title:</h3><input id="title" placeholder="Title"><br>
        <h3>Content:</h3><textarea id="content" placeholder="Content"></textarea><br>
        <button>Save</button>
    </form>
</div>

{% comment %} ##### SCRIPT ##### {% endcomment %}
<script>
const id = window.location.pathname.split("/").filter(Boolean).pop();
const csrfToken = document.getElementById("csrfToken").value;
const form = document.getElementById("form");

// Inputs
const typeInput = document.getElementById("content_type");
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");

// LOAD EDUCATIONAL CONTENT
fetch(`/api/products/education/${id}/`, { credentials: "include" })
.then(res => res.json())
.then(item => {
    typeInput.value = item.content_type;
    titleInput.value = item.title;
    contentInput.value = item.content;
});

// SAVE
form.onsubmit = e => {
    e.preventDefault();

    fetch(`/api/products/education/${id}/`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        credentials: "include",
        body: JSON.stringify({
            content_type: typeInput.value,
            title: titleInput.value,
            content: contentInput.value
        })
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Update failed");
        }
        return res.json();
    })
    .then(() => {
        alert("Educational content updated!");
        window.location.href = "/api/orders/dashboard/producer/view/";
    })
    .catch(err => {
        console.error(err);
        alert("Update failed - check console");
    });
};
</script>

</body>
</html>
